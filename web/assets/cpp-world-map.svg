<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">C++ Adventure illustrated world map</title>
  <desc id="desc">A hand-drawn fantasy coding world with a forest, village, dungeon, mountains, libraries and a final boss fortress.</desc>
  <defs>
    <linearGradient id="sea" x2="0" y2="1"><stop stop-color="#18294a"/><stop offset="1" stop-color="#101526"/></linearGradient>
    <linearGradient id="land" x2="0.8" y2="1"><stop stop-color="#476e63"/><stop offset=".48" stop-color="#345a57"/><stop offset="1" stop-color="#293c51"/></linearGradient>
    <linearGradient id="gold" x2="0" y2="1"><stop stop-color="#ffe19a"/><stop offset="1" stop-color="#da945b"/></linearGradient>
    <linearGradient id="boss" x2="0" y2="1"><stop stop-color="#76416c"/><stop offset="1" stop-color="#3a284d"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="9" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="stars" width="190" height="150" patternUnits="userSpaceOnUse"><circle cx="22" cy="33" r="1.6" fill="#e4d2ff" opacity=".55"/><circle cx="132" cy="95" r="1.2" fill="#9bd8ee" opacity=".5"/><path d="M83 20v8m-4-4h8" stroke="#cba6ff" stroke-width="1" opacity=".4"/></pattern>
