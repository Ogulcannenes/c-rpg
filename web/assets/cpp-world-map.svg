      <path d="m15 20 1 12 11-7zm31 0 1 12-12-7z" fill="#e98c9e"/>
      <ellipse cx="25" cy="49" rx="3.5" ry="5" fill="#182235"/><ellipse cx="47" cy="49" rx="3.5" ry="5" fill="#182235"/>
