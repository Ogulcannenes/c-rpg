    <g id="mountain"><path d="m0 92 65-82 60 82z" fill="#67779a"/><path d="m45 35 20-25 24 34-18-8-12 8z" fill="#e8e7f2"/><path d="m64 10-8 31 12-7 10 7z" fill="#c1d5e8"/><path d="m0 92 40-48 25 48" fill="#506785" opacity=".7"/></g>
    <g id="house"><path d="M0 28 35 3l37 25v43H0z" fill="#b77e61" stroke="#f1c88b" stroke-width="3"/><path d="M-5 29 35 0l43 29-6 8-37-25L1 37z" fill="#574165" stroke="#d89bca" stroke-width="3"/><path d="M29 47h16v24H29zM9 40h12v12H9zm39 0h14v12H48z" fill="#f6d27f"/><path d="M35 7v15" stroke="#fff1bd" stroke-width="3"/></g>
